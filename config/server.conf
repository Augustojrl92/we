# === Server 4 ===

server {
    listen							127.0.0.2:8085;
    root 							$PROJECT_ROOT/www/web2;
	index							index.html;

    client_max_body_size            10M;

	location /pages {
		allow_methods				GET HEAD OPTIONS;
		alias						$PROJECT_ROOT/www/web2/pages/;
		client_max_body_size 		5M;
		index						index_pages.html;
	}

    location /upload {
		allow_methods 				POST;
		upload_enable				on;
		upload_store				$PROJECT_ROOT/www/web2/uploads;
    	client_max_body_size		20;
	}
}

