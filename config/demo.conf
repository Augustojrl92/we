		# -> NGINX cannot resolve where '/upload' maps to on disk -> this makes it impossible to serve static files or route the request
		#    requests to /upload will fail — typically with a '404 Not Found' or fallback behavior.
		# however, if the server block define a 'root', this empty location would be valid, as it would inherit the root path and become resolvable
    #}

	# Directory Listing Location
	location /auto {
		allow_methods				GET HEAD OPTIONS;									# directory listing is read-only
		root						$PROJECT_ROOT/www/web1/auto;
        autoindex					on;
		#autoindex					true;												# reject->no boolean->directive must be 'on' or 'off'
		#autoindex;																		# reject->missing argument->it requires an explicit argument and has no default value in NGINX
	}

	# when a client requests /redirect, the server should respond with HTTP 301 Moved Permanently
	# when a server responds with HTTP status code 301, it is telling the client ->
	# "The resource you're trying to access at /redirect has been permanently moved to a new location (/new-location).
	# Use the new location from now on."
	# This is commonly used when:
	# a) you've renamed a route
	# b) you've permanently moved content
	
	# test by using browser
	# A)
	# http://127.0.0.1:8080/redirect browser caches 301 redirects, so it treats the new location as the correct one
	# -> the browser recieve a 301 redirect response and automatically redirect you to http://localhost:8080/new-location
	# B) 
	# redirect location -> change return to 301 http://127.0.0.1:8085/new-location;
	# server 4 change listen to 127.0.0.1:8085;
	# http://127.0.0.1:8080/redirect
	# ¡! DNS -> browsers resolves this via DNS -> 
	
	# test by using curl
	# A)
	# curl -i http://127.0.0.1:8080/redirect
	# HTTP/1.1 301 Moved Permanently
	# Location: /new-location
	# Content-Type: text/html
	# Content-Length: 0
	# Connection: close
	# curl -L http://127.0.0.1:8080/redirect
	# content index.html at new-location $PROJECT_ROOT/www/web1/new-location/index.html
	# B)
	# curl -i http://127.0.0.1:8080/redirect
	# HTTP/1.1 301 Moved Permanently
	# Location: http://127.0.0.2:8085/new-location
	# Content-Type: text/html
	# Content-Length: 0
	# Connection: close
	# curl -L http://127.0.0.1:8080/redirect
	# content index.html at new-location $PROJECT_ROOT/www/web2/new-location/index.html

	# serve an informative page so they know what happened index.html

	# Redirect Location
	location /redirect {
		allow_methods				GET HEAD OPTIONS;									# HEAD/OPTIONS valid even on redirect; No allow_methods defined -> server block by default -> POST or DELETE requests might not behave as intended with a 301; Browsers may convert POST to GET on redirect, leading to unexpected or incorrect behavior
		return						301 /new-location;									# allowed -> redirect with URL (1) user requests /redirect (2) server responds with HTTP 301 redirect to /new-location (3) browser requests /new-location (4) server serves content from /new-location folder (www/web1/new-location/index.html)
		#return						301 http://127.0.0.2:8085/new-location;				# the client is told to go to http://127.0.0.2:8085/new-location it hits Server 4 (web2), which serves content from ./www/web2/new-location/index.html
		#return						abc /x;												# reject->Invalid number format: expected a valid integer -> Error: Invalid redirection code in return directive
		#return						200;												# allowed -> 200 is a non-redirect success status code
		#return						404;												# allowed -> 404 is an error code, no URL needed
		#return						301;												# reject -> 301 is a redirect code but URL is missing -> Error: Invalid status code: 3xx redirection codes require a target URL and cannot be used alone
		#return						500;												# allowed -> 500 is an error code, no URL needed
		#return;																		# reject -> missing argument -> it requires an explicit argument and has no default value in NGINX
	}

	# Error fallback page for any 50x server error:
	location /errors/50x.html {															# This block is only relevant if the configuration file includes /50x.html in an error_page directive
		allow_methods				GET HEAD OPTIONS;									# Static fallback error content. Error page should be read-only
	}
}																						# if no } -> unexpected end of configuration file: incomplete config.


