	# Handler: CGI Executer																# enable running CGI scripts
	location /cgi/php {
		allow_methods				GET POST OPTIONS HEAD;								# Dynamic scripts that receive input — perfect use of POST and HEAD.
		alias               		$PROJECT_ROOT/www/web1/cgi-bin/php/;   				# ¡! all CGI-enabled location blocks must use an alias directive for correct path resolution (URL = IP:port + URL path) http://127.0.0.1:8080/cgi/php/script.php maps to (filesystem) /www/web1/cgi-bin/script.php -> 'alias' the server takes the URL path /cgi/php/script.php and maps it to the file on disk /www/web1/cgi-bin/script.php
		index						index.php custom.php;								# .php not need to make it executable -> PHP scripts are not executed directly. Instead, your webserver reads the PHP file and passes it to the PHP interpreter.
		cgi_pass					$PROJECT_ROOT/www/bin/fake_php;
		#cgi_pass					$PROJECT_ROOT/www/bin/fake_php/;					# trailing slash -> reject -> a) with / "this is a directory" -> pathExists("./www/bin/fake_php/") && isExecutable(...) if that path is a file, not a directory —> this check fails b) without / "this is an executable file", so pathExists("./www/bin/fake_php") && isExecutable(...) will work
		client_max_body_size		5M;
	}
	
	location /cgi/py {
		allow_methods				GET POST OPTIONS HEAD;								# Dynamic scripts that receive input — perfect use of POST and HEAD.
		alias						$PROJECT_ROOT/www/web1/cgi-bin/py/;					# ¡! all CGI-enabled location blocks must use an alias directive for correct path resolution (URL = IP:port + URL path) http://127.0.0.1:8080/cgi/py/script.py maps to (filesystem) /www/web1/cgi-bin/script.py -> 'alias' the server takes the URL path /cgi/py/script.py and maps it to the file on disk /www/web1/cgi-bin/script.py
		index						index.py custom.py;									# (chmod +x custom.py amd chmod +x index.py) .py runs directly as a CGI script, so your webserver needs execute permission
		cgi_pass					/usr/bin/python3;
		#cgi_pass;																		# reject->missing argument
		client_max_body_size		5M;
	}

