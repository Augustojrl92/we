	# Error Pages																		# when no error_page is defined, NGINX serves its built-in error response (404/500/... response) at the request processing stage, not during config parsing
	error_page						400 /errors/400.html;								# for example, root (./www/web1) + URI (/errors/400.html) -> full path (./www/web1/errors/400.html)
	error_page						401 /errors/401.html;								# ¡! missing file — handled at request time with built-in fallback - do not throw-> log (yellow) [warn] Error page file does not exist: .//www/web1/errors/401.html
	error_page						404 /errors/404.html;
	error_page						405 /errors/405.html;								# ¡! missing file — handled at request time with built-in fallback - do not throw-> log (yellow) [warn] Error page file does not exist: .//www/web1/errors/405.html
	error_page						500 501 502 503 504 505 /errors/50x.html;			# any server error (HTTP 5xx) should serve the same error page at URI /50x.html
	#error_page						404 500 /errors/server_error.html;					# Key: error_page Value [0] 404 Value [1] 500 Value [2] /errors/server_error.html -> std::vector<std::string> = {"404", "500", "/errors/server_error.html"}
