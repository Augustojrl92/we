server {
    listen							localhost:9090;
    server_name						www.example1.com;										
	server_name						www.example2.com;
    root							$PROJECT_ROOT/www/web1;
}

# multiple servers on the same IP:port
# on the same machine, you cannot have two different server processes listening on the exact same IP address and port combination at the same time
# server 1 and server 3 both try to listen on 127.0.0.1:8080, which will cause a binding conflict.
# our server supports virtual hosting
# if your web server supports virtual hosting (by matching Host: header) it will work
# virtual hosting allows a single server process to serve multiple websites or configurations on the same port
# by distinguishing the requests based on domain name
# when an HTTP request arrives, the server checks the Host header to determine which virtual host (server block) should handle it.
# if the Host header matches one of the server_name directives, the corresponding virtual host serves the request.
# but if the Host header is missing or doesn’t match any server_name, the server needs a fallback
# the server routes the request to the default server block -> the first server block defined for that IP:port acts as the default
# It prevents requests from failing just because the client didn’t send the expected Host header.
# It helps avoid “no server found” errors.
# It gives you a chance to serve a default site or a catch-all page.

# === Server 3 ===

server {
    listen							localhost:8080;
	server_name						www.example3.com;
	index							index2.html;
    root							$PROJECT_ROOT/www/web2;
}

